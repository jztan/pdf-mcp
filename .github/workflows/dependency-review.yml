name: Dependency Review

on:
  pull_request:
    branches:
      - master
      - develop
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - 'requirements*.txt'
  # Every other gate is change-triggered, so a lockfile that stops changing
  # stops being audited. Advisories are published against versions already
  # shipped: the code does not change, the advisory data does. Re-run weekly
  # so a newly disclosed vulnerability surfaces without waiting for the next
  # dependency edit or release.
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # audit.sh exports the frozen lockfile via `uv export`, so uv must be on PATH.
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Audit for known vulnerabilities
        # Ignore list lives in scripts/audit.sh so local preflight and CI stay in sync.
        run: uv run bash scripts/audit.sh
