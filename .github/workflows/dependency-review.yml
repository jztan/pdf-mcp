name: Dependency Review

on:
  pull_request:
    branches:
      - master
      - develop
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - 'requirements*.txt'
  # Every other gate is change-triggered, so a lockfile that stops changing
  # stops being audited. Advisories are published against versions already
  # shipped: the code does not change, the advisory data does. Re-run weekly
  # so a newly disclosed vulnerability surfaces without waiting for the next
  # dependency edit or release.
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      # audit.sh exports the frozen lockfile via `uv export`, so uv must be on PATH.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Audit for known vulnerabilities
        # Ignore list lives in scripts/audit.sh so local preflight and CI stay in sync.
        run: bash scripts/audit.sh
