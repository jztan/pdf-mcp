name: CI

# Prose-only pushes skip this matrix. The `paths-ignore` list below is
# the set of files nothing here reads; every push that touches anything
# else (a mixed docs-plus-code push included, GitHub evaluates the filter
# against the whole push) still runs all seven jobs. The docs that ARE
# read by tests (README, CHANGELOG, ROADMAP, docs/, the fusion block in
# pages/index.html) get their own one-job check in docs.yml, which
# triggers on exactly this list. tests/test_ci_workflows.py holds the two
# lists to the same set, so a path cannot be dropped from one and not the
# other. Before 2026-09-12 a CHANGELOG-only merge to develop ran the full
# matrix (5 Linux + 2 Windows, ~20 minutes of wall time) for nothing.
on:
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'SECURITY.md'
      - 'CODE_OF_CONDUCT.md'
      - 'docs/**'
      - 'pages/**'
      - 'examples/README.md'
      - 'benchmark_data/**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

  push:
    branches:
      - develop
      - feature/*
      - release/*
      - hotfix/*
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'SECURITY.md'
      - 'CODE_OF_CONDUCT.md'
      - 'docs/**'
      - 'pages/**'
      - 'examples/README.md'
      - 'benchmark_data/**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

  workflow_dispatch:  # allows manual run from GitHub UI

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Pin fastembed's model directory so actions/cache can restore it.
      # Without the pin it lands under the OS temp dir, outside the workspace
      # and never cached. (runner.temp is not usable in job-level env.)
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed_cache
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Audit dependencies for known vulnerabilities
        # Ignore list lives in scripts/audit.sh so local preflight and CI stay in sync.
        run: uv run bash scripts/audit.sh
      - name: Run linter
        run: uv run flake8 src/ scripts/ tests/
      - name: Check formatting
        run: uv run black --check src/ scripts/ tests/
      - name: Run type checker
        # Intentionally src/-only: test and script bodies are untyped and
        # would need per-module relaxations. Tracked in docs_internal/backlog.md.
        run: uv run mypy src/
      - name: Restore the embedding model cache
        # bge-small lives only on Hugging Face Hub (fastembed has no mirror
        # for it). Downloading it on every job made the gate depend on that
        # host: on 2026-08-29 one Windows job stalled at file 2/5 for 17
        # minutes with no error. With this cache the hub is contacted only
        # when the key misses, roughly once per model or fastembed bump.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.fastembed_cache
          key: fastembed-model-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            fastembed-model-${{ runner.os }}-
      - name: Warm the embedding model cache
        # Bound the cold-miss download. A stalled stream never trips the
        # hub client's per-read timeout, so without this the job burns its
        # whole budget; failing fast makes a re-run cheap.
        timeout-minutes: 3
        # fastembed downloads bge-small into one shared cache directory.
        # Under -n auto several workers can trigger that first download at
        # the same time and race, which failed the RRF gate on one Python
        # version with NO_SUCHFILE while the others passed. Fetching it
        # once, before pytest, removes the race rather than retrying it.
        run: >
          uv run python -c
          "from pdf_mcp.embedder import encode, DEFAULT_MODEL;
          encode(['warm the model cache'], DEFAULT_MODEL)"
      - name: Run tests
        # -n auto: the suite is I/O and subprocess heavy (nearly every test
        # builds or opens a PDF), so it parallelises well. xdist workers are
        # separate processes, so the gates that swap module-level state (the
        # isolated corpus cache) stay isolated per worker rather than racing.
        run: uv run pytest tests/ -v -n auto

  # (see test-windows below for why the slow marker is deselected there
  # but not here)

  # Windows is ~40% of PyPI downloads and had no coverage at all until the
  # PyMuPDF replacement, which swapped the PDF engine under every user. The
  # backend's platform-sensitive surfaces are real: spawn-only multiprocessing
  # (parallel.py, corpus.py), SQLite cache files that Windows will not let us
  # delete while open, and tessdata discovery, which differs from Unix in two
  # ways (--list-langs goes to stdout, and TESSDATA_PREFIX points at the
  # install root). Lint, format, type-check and audit are platform-independent
  # and stay on the Linux job; this one only proves the code runs.
  test-windows:
    runs-on: windows-latest
    env:
      # Pin fastembed's model directory so actions/cache can restore it.
      # Without the pin it lands under the OS temp dir, outside the workspace
      # and never cached. (runner.temp is not usable in job-level env.)
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed_cache
    # Windows has no default job timeout worth relying on (GitHub's is 6
    # hours), and the failure mode this job exists to catch -- spawn-only
    # multiprocessing -- deadlocks rather than errors.
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Restore the Tesseract install
        # choco took about a minute on every run. The UB Mannheim install is a
        # self-contained folder, so a pinned version restores from cache and
        # choco runs only when the version (the cache key) changes.
        id: tesseract-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\Program Files\Tesseract-OCR
          key: tesseract-choco-5.5.3.20260724
      - name: Install Tesseract
        # Without this the OCR tests skip themselves (shutil.which guard) and
        # the Windows-specific tessdata discovery path would never be tested,
        # which is the single most platform-divergent piece of code we have.
        if: steps.tesseract-cache.outputs.cache-hit != 'true'
        run: choco install --no-progress -y tesseract --version 5.5.3.20260724
      - name: Put Tesseract on PATH
        # choco edits the machine PATH, which does not reliably reach later
        # steps. Without this the which() guard fails and every OCR test
        # skips -- green, and testing nothing.
        run: echo "C:\Program Files\Tesseract-OCR" >> $env:GITHUB_PATH
        shell: pwsh
      - name: Verify Tesseract is visible to the tests
        # Fail loudly here rather than let the OCR tests skip themselves.
        run: |
          tesseract --version
          uv run python -c "import shutil; assert shutil.which('tesseract'), 'tesseract not on PATH'"
      - name: Restore the embedding model cache
        # bge-small lives only on Hugging Face Hub (fastembed has no mirror
        # for it). Downloading it on every job made the gate depend on that
        # host: on 2026-08-29 one Windows job stalled at file 2/5 for 17
        # minutes with no error. With this cache the hub is contacted only
        # when the key misses, roughly once per model or fastembed bump.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.fastembed_cache
          key: fastembed-model-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            fastembed-model-${{ runner.os }}-
      - name: Warm the embedding model cache
        # Bound the cold-miss download. A stalled stream never trips the
        # hub client's per-read timeout, so without this the job burns its
        # whole budget; failing fast makes a re-run cheap.
        timeout-minutes: 3
        # fastembed downloads bge-small into one shared cache directory.
        # Under -n auto several workers can trigger that first download at
        # the same time and race, which failed the RRF gate on one Python
        # version with NO_SUCHFILE while the others passed. Fetching it
        # once, before pytest, removes the race rather than retrying it.
        run: >
          uv run python -c
          "from pdf_mcp.embedder import encode, DEFAULT_MODEL;
          encode(['warm the model cache'], DEFAULT_MODEL)"
      - name: Run tests
        # Deselect the slow marker here, unlike the Linux job. It covers
        # the retrieval-quality gates, which measure ranking rather than
        # platform behaviour and cannot fail on Windows alone -- and one
        # of them, test_rrf_v2_no_regression_vs_baseline, took 8.5 of
        # this job's 20 minutes. What this job is for is the
        # platform-divergent surfaces above, and those are not marked
        # slow.
        run: uv run pytest tests/ -v -m "not slow" -n auto


  # The bundle smoke used to run inside test-windows (3.13) and made it the
  # slowest job by ~1.5 min; on its own it runs alongside the test jobs.
  bundle-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Launcher unit tests (real tar.exe on a real zip)
        run: node --test tests/launcher/launcher.test.js
      - name: Build the Claude Desktop bundle from this commit
        # Proves the node launcher installs this commit's wheel through a
        # freshly downloaded, pinned uv, with no uv on PATH, and answers an
        # MCP handshake with every tool the manifest declares.
        shell: pwsh
        run: |
          uv build --wheel
          $whl = (Get-ChildItem dist/pdf_mcp-*.whl).FullName
          uv run python scripts/build_mcpb.py --wheel $whl --out bundle-smoke
          Expand-Archive (Get-ChildItem bundle-smoke/*.mcpb).FullName -DestinationPath bundle-smoke/unpacked
          npx -y @anthropic-ai/mcpb@2.1.2 validate bundle-smoke/unpacked/manifest.json
      - name: Start the bundle with nothing preinstalled
        shell: pwsh
        run: |
          $py = (uv run python -c "import sys; print(sys.executable)").Trim()
          $env:PATH = ($env:PATH -split ';' | Where-Object { -not (Test-Path (Join-Path $_ 'uv.exe')) }) -join ';'
          & $py scripts/smoke_mcpb.py bundle-smoke/unpacked --timeout 900 --pdf pages/corpus/gao-cloud.pdf --extra-env "PDF_MCP_CACHE_DIR=$env:RUNNER_TEMP\pdfmcp-cold"
          & $py scripts/smoke_mcpb.py bundle-smoke/unpacked --expect-fallback --timeout 120 --extra-env "PDF_MCP_CACHE_DIR=$env:RUNNER_TEMP\pdfmcp-blocked" --extra-env "PDF_MCP_UV_DOWNLOAD_BASE=https://127.0.0.1:9/"

  # Claude Desktop cannot run in CI, so this proves the bundle's launcher
  # path on macOS (pinned darwin uv, bsdtar extraction, uv-managed Python,
  # early init, hand-over, fallback) the way test-windows does for Windows.
  # Host behaviour (60 s initialize limit, 30 s request limit, list_changed)
  # was measured once in Claude Desktop and does not depend on the OS.
  bundle-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Launcher unit tests (real bsdtar on a real tarball)
        run: node --test tests/launcher/launcher.test.js
      - name: Build the Claude Desktop bundle from this commit
        run: |
          uv build --wheel
          uv run python scripts/build_mcpb.py --wheel "$(ls dist/pdf_mcp-*.whl)" --out bundle-smoke
          mkdir -p bundle-smoke/unpacked
          (cd bundle-smoke/unpacked && unzip -q ../pdf-mcp-*.mcpb)
          npx -y @anthropic-ai/mcpb@2.1.2 validate bundle-smoke/unpacked/manifest.json
      - name: Start the bundle from an empty cache, then with the download blocked
        # The launcher never looks at PATH: it downloads its pinned uv and uv
        # fetches its own Python. The checks after the cold start prove both
        # came from the launcher, not from the runner.
        run: |
          py="$(uv run python -c 'import sys; print(sys.executable)')"
          cold="$RUNNER_TEMP/pdfmcp-cold"
          "$py" scripts/smoke_mcpb.py bundle-smoke/unpacked --timeout 900 --pdf pages/corpus/gao-cloud.pdf --extra-env "PDF_MCP_CACHE_DIR=$cold"
          uv_bin="$(ls "$cold"/uv/*/uv)"
          echo "launcher's uv: $uv_bin"
          test -x "$uv_bin"
          test -n "$(ls "$cold/python")"
          test -d "$cold/venv/$(python3 -c "import json; print(json.load(open('bundle-smoke/unpacked/manifest.json'))['version'])")"
          tail -n 20 "$cold/launcher.log"
          "$py" scripts/smoke_mcpb.py bundle-smoke/unpacked --expect-fallback --timeout 120 --extra-env "PDF_MCP_CACHE_DIR=$RUNNER_TEMP/pdfmcp-blocked" --extra-env "PDF_MCP_UV_DOWNLOAD_BASE=https://127.0.0.1:9/"
