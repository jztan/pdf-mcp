# THROWAWAY: answers the Phase 0 spike questions for the Claude Desktop
# bundle. Deleted once the permanent smoke steps land in ci.yml.
name: mcpb spike
on:
  push:
    branches: [feature/mcpb-bundle]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spike:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: false
      - name: Build wheel and bundle
        shell: pwsh
        run: |
          uv build --wheel
          $whl = (Get-ChildItem dist/pdf_mcp-*.whl).FullName
          uv sync --frozen --extra dev
          uv run python scripts/build_mcpb.py --wheel $whl --out spike
          Expand-Archive (Get-ChildItem spike/*.mcpb).FullName -DestinationPath spike/unpacked
          # The project venv's python has `mcp` (via fastmcp) for the smoke
          # client and keeps working after uv is removed from PATH.
          uv run python -c "import sys; print(sys.executable)" > py.txt
      - name: Launcher unit tests on Windows (real tar.exe on a real zip comes next)
        shell: pwsh
        run: node --test tests/launcher/launcher.test.js
      - name: Zero-prerequisite start (no uv on PATH, empty cache)
        shell: pwsh
        run: |
          $py = (Get-Content py.txt).Trim()
          $env:PDF_MCP_CACHE_DIR = "$env:RUNNER_TEMP\pdfmcp-cold"
          $env:PATH = ($env:PATH -split ';' | Where-Object { -not (Test-Path (Join-Path $_ 'uv.exe')) }) -join ';'
          if (Get-Command uv -ErrorAction SilentlyContinue) { throw "uv still on PATH" }
          & $py scripts/smoke_mcpb.py spike/unpacked --timeout 900
          Get-ChildItem "$env:PDF_MCP_CACHE_DIR\uv" -Recurse | Select-Object FullName
      - name: Fallback responder when the download is blocked
        shell: pwsh
        run: |
          $py = (Get-Content py.txt).Trim()
          & $py scripts/smoke_mcpb.py spike/unpacked --expect-fallback --timeout 120 `
            --extra-env "PDF_MCP_CACHE_DIR=$env:RUNNER_TEMP\pdfmcp-blocked" `
            --extra-env "PDF_MCP_UV_DOWNLOAD_BASE=https://127.0.0.1:9/"
      - name: Validate manifest with the official CLI
        shell: pwsh
        run: npx -y @anthropic-ai/mcpb@2.1.2 validate spike/unpacked/manifest.json
