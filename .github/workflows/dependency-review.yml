name: Dependency Review

on:
  pull_request:
    branches:
      - master
      - develop
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - 'requirements*.txt'
  # Every other gate is change-triggered, so a lockfile that stops changing
  # stops being audited. Advisories are published against versions already
  # shipped: the code does not change, the advisory data does. Re-run weekly
  # so a newly disclosed vulnerability surfaces without waiting for the next
  # dependency edit or release.
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # audit.sh exports the frozen lockfile via `uv export`, so uv must be on PATH.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Audit for known vulnerabilities
        # Ignore list lives in scripts/audit.sh so local preflight and CI stay in sync.
        run: bash scripts/audit.sh
